app = 'vr-tour'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # Reduced resources to save monthly costs
  memory = '256mb'
  cpus = 1
